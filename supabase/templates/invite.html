<div
  style="
    font-family: Georgia, &quot;Times New Roman&quot;, serif;
    color: #1c1b19;
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 24px;
  "
>
  <p
    style="
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b675f;
      margin: 0 0 24px;
    "
  >
    Development Systems Architecture OS
  </p>
  <h1 style="font-size: 22px; font-weight: normal; margin: 0 0 16px">You have been invited</h1>
  <p
    style="
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: #3d3a34;
    "
  >
    You have been given access to a secure engagement environment. Use the link below to accept the
    invitation and set your password.
  </p>
  <p style="margin: 28px 0">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/account/set-password"
      style="
        font-family: Helvetica, Arial, sans-serif;
        font-size: 14px;
        background: #1f2a36;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 2px;
      "
      >Accept invitation</a
    >
  </p>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #6b675f">
    If you were not expecting this message, you can ignore it.
  </p>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #6b675f">
    The Purple Lamb Company
  </p>
</div>
